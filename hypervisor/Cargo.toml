[package]
authors = ["Microsoft Authors"]
edition.workspace = true
license = "Apache-2.0 OR BSD-3-Clause"
name = "hypervisor"
rust-version.workspace = true
version = "0.1.0"

[features]
# Apple Hypervisor.framework backend (macOS, arm64). Links the system
# Hypervisor.framework via build.rs. Pulls in `smoltcp` for the userspace
# egress NAT (`hvf::virtio::nat`): the resumed guest has no tap/bridge, so its
# only network path is a userspace TCP/IP stack that terminates guest flows and
# relays them to host sockets under the control-plane egress policy (M28).
hvf = ["dep:smoltcp"]
kvm = ["kvm-bindings", "kvm-ioctls", "vfio-ioctls/kvm"]
# Ingest a serialized KVM arm64 vCPU snapshot (the real `kvm-bindings` ABI
# types) WITHOUT the Linux-only `kvm-ioctls`/VFIO machinery, so the HVF backend
# on macOS can translate a cloud KVM snapshot. Pairs with `hvf`.
kvm-snapshot = ["kvm-bindings"]
mshv = ["mshv-bindings", "mshv-ioctls", "mshv_emulator", "vfio-ioctls/mshv"]
mshv_emulator = ["iced-x86", "mshv-bindings"]
sev_snp = ["igvm", "igvm_defs"]
tdx = []

[dependencies]
anyhow = { workspace = true }
arc-swap = "1.9.1"
bitfield-struct = "0.13.0"
byteorder = { workspace = true }
cfg-if = { workspace = true }
concat-idents = "1.1.5"
igvm = { workspace = true, optional = true }
igvm_defs = { workspace = true, optional = true }
kvm-bindings = { workspace = true, optional = true, features = ["serde"] }
kvm-ioctls = { workspace = true, optional = true }
libc = { workspace = true }
log = { workspace = true }
mshv-bindings = { workspace = true, features = [
  "fam-wrappers",
  "with-serde",
], optional = true }
mshv-ioctls = { workspace = true, optional = true }
open-enum = "0.5.2"
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
serde_with = { workspace = true, default-features = false, features = [
  "macros",
] }
# Userspace TCP/IP stack for the HVF egress NAT (M28). Enabled only by the
# `hvf` feature so Linux/KVM builds don't pull it. `std` gives us the host
# socket glue; ipv4 + tcp/udp cover the V0 egress surface. The guest is
# statically addressed by capture-side cloud-init, so no DHCP server is needed.
smoltcp = { version = "0.12", default-features = false, features = [
  "std",
  "medium-ethernet",
  "proto-ipv4",
  "socket-tcp",
  "socket-udp",
], optional = true }
thiserror = { workspace = true }
vm-memory = { workspace = true, features = [
  "backend-atomic",
  "backend-bitmap",
  "backend-mmap",
] }
vmm-sys-util = { workspace = true, features = ["with-serde"] }
zerocopy = { workspace = true, features = ["derive"] }

# VFIO passthrough is Linux-only (ioctl/eventfd based); keep it off other hosts
# such as macOS so the crate can build there for the Hypervisor.framework backend.
[target.'cfg(target_os = "linux")'.dependencies]
vfio-ioctls = { workspace = true, default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies.iced-x86]
default-features = false
features = [
  "decoder",
  "instr_info",
  "no_d3now",
  "no_evex",
  "no_vex",
  "no_xop",
  "op_code_info",
  "std",
]
optional = true
version = "1.21.0"

[dev-dependencies]
env_logger = { workspace = true }

[lints]
workspace = true
